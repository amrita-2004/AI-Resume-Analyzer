    ]]></style><rect fill="#f8fafc" height="100%" width="100%" x="0" y="0" /><text class="title" x="50" y="45">System Architecture Diagram - Production Stack</text><text class="subtitle" x="50" y="70">Frontend, Flask REST API &amp; WebSocket Server, Business Services, Security &amp; MongoDB Storage</text><rect class="layer-box" height="100" width="1000" x="50" y="110" /><text class="layer-title" x="70" y="135">FRONTEND PRESENTATION LAYER</text><rect class="comp-box" height="60" width="200" x="280" y="130" /><text class="comp-title" x="380" y="165">HTML5 / CSS3 / JS UI</text><rect class="comp-box" height="60" width="200" x="510" y="130" /><text class="comp-title" x="610" y="165">Chart.js Dashboard</text><rect class="comp-box" height="60" width="200" x="740" y="130" /><text class="comp-title" x="840" y="165">SocketIO Client</text><rect class="layer-box" height="110" width="1000" x="50" y="250" /><text class="layer-title" x="70" y="275">FLASK BACKEND &amp; ROUTING LAYER</text><rect class="comp-box" height="60" width="180" x="280" y="280" /><text class="comp-title" x="370" y="315">REST API Blueprints</text><rect class="comp-box" height="60" width="180" x="480" y="280" /><text class="comp-title" x="570" y="315">Flask-SocketIO Engine</text><rect class="comp-box" height="60" width="180" x="680" y="280" /><text class="comp-title" x="770" y="315">Flask-Login &amp; 2FA Middleware</text><rect class="layer-box" height="140" width="1000" x="50" y="400" /><text class="layer-title" x="70" y="425">BUSINESS LOGIC &amp; NLP ENGINES</text><rect class="comp-box" height="65" width="170" x="70" y="450" /><text class="comp-title" x="155" y="488">Resume Parser</text><rect class="comp-box" height="65" width="170" x="255" y="450" /><text class="comp-title" x="340" y="488">NLP &amp; Skill Engine</text><rect class="comp-box" height="65" width="170" x="440" y="450" /><text class="comp-title" x="525" y="488">ATS &amp; Gap Matcher</text><rect class="comp-box" height="65" width="170" x="625" y="45